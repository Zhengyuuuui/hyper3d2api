<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hyper3d2api Console</title>
<style>
  :root{--bg:#0d0f14;--card:#161a22;--line:#252b36;--fg:#e6e9ef;--dim:#8b94a7;--acc:#6ea8fe;--ok:#4ade80;--warn:#fbbf24;--err:#f87171}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600}
  .pill{padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--ok);border-color:#1e4d33}
  .pill.err{color:var(--err);border-color:#4d1e1e}
  main{padding:22px;display:grid;gap:18px;grid-template-columns:1fr 1fr;max-width:1180px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
  select,input,textarea{width:100%;background:#0b0e13;border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:8px 10px;font:inherit}
  textarea{min-height:64px;resize:vertical}
  button{margin-top:14px;background:var(--acc);color:#08111f;border:0;border-radius:7px;
    padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  pre{background:#0b0e13;border:1px solid var(--line);border-radius:7px;padding:12px;
    overflow:auto;max-height:420px;font-size:12px;white-space:pre-wrap;word-break:break-all}
  .row{display:flex;gap:10px}.row>*{flex:1}
  a{color:var(--acc)}
  .muted{color:var(--dim);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--dim);font-weight:500;font-size:12px}
  .err-t{color:var(--err)}.ok-t{color:var(--ok)}
</style>
</head>
<body>
<header>
  <h1>hyper3d2api</h1>
  <span class="pill" id="health">checking…</span>
  <span class="pill" id="bal">balance —</span>
  <span class="muted">已验证可用：pixverse (v5~v6/c1) · seedream_4_5 · seedream_5_0_lite</span>
</header>

<main>
  <section class="card">
    <h2>生成</h2>
    <label>模型</label>
    <select id="model"></select>
    <label>Prompt</label>
    <textarea id="prompt">a red apple on a wooden table</textarea>
    <div class="row">
      <div><label>时长 (秒)</label><select id="duration">
        <option>5</option><option>8</option><option>10</option><option>15</option></select></div>
      <div><label>分辨率</label><select id="resolution">
        <option>720p</option><option>1080p</option><option>540p</option><option>360p</option></select></div>
    </div>
    <div class="row">
      <div><label>比例</label><select id="aspect">
        <option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option>
        <option>3:4</option><option>21:9</option></select></div>
      <div><label>尺寸 (图像)</label><select id="size">
        <option>2048x2048</option><option>1024x1024</option><option>1728x2304</option>
        <option>2304x1728</option></select></div>
    </div>
    <button id="go">生成</button>
  </section>

  <section class="card">
    <h2>结果</h2>
    <pre id="out">等待请求…</pre>
    <div id="preview"></div>
  </section>

  <section class="card" style="grid-column:1/-1">
    <h2>可用模型 / 不可用模型</h2>
    <div class="row">
      <div><table id="t-ok"></table></div>
      <div><table id="t-no"></table></div>
    </div>
  </section>
</main>

<script>
const KEY = "sk-hyper3d-local";
const $ = s => document.querySelector(s);
const H = {"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};

async function health(){
  try{
    const r = await fetch("/health"); const d = await r.json();
    const el = $("#health");
    el.textContent = d.turnstile_connected ? "CDP 已连接" : "CDP 未连接";
    el.className = "pill " + (d.turnstile_connected ? "ok" : "err");
  }catch(e){ $("#health").textContent="bridge offline"; $("#health").className="pill err"; }
  try{
    const r = await fetch("/v1/balance",{headers:H}); const d = await r.json();
    const el=$("#bal");
    el.textContent = "余额 " + d.balance + " · " + (d.plan||"");
    el.className = "pill " + (Number(d.balance)>0 ? "ok":"err");
  }catch(e){}
}

async function models(){
  const r = await fetch("/v1/models",{headers:H}); const d = await r.json();
  const sel = $("#model"); sel.innerHTML="";
  d.data.forEach(m=>{
    const o=document.createElement("option");
    o.value=m.id; o.textContent=m.id+"  ("+m.family+")";
    o.dataset.family=m.family; sel.appendChild(o);
  });
  let h="<tr><th>ID</th><th>类型</th><th>实测</th></tr>";
  d.data.forEach(m=>{ h+=`<tr><td>${m.id}</td><td>${m.family}</td>
      <td class="ok-t">${(m.verified||[]).join("<br>")}</td></tr>`; });
  $("#t-ok").innerHTML=h;

  const b = await fetch("/v1/blocked-models",{headers:H}); const bd = await b.json();
  let h2="<tr><th>ID</th><th>原因</th></tr>";
  bd.data.forEach(m=>{ h2+=`<tr><td>${m.id}</td><td class="err-t">${m.reason}</td></tr>`; });
  $("#t-no").innerHTML=h2;
}

$("#go").onclick = async () => {
  const m = $("#model").value;
  const fam = $("#model").selectedOptions[0].dataset.family;
  const body = {model:m, prompt:$("#prompt").value};
  if(fam==="video"){ body.duration=Number($("#duration").value);
                    body.resolution=$("#resolution").value;
                    body.aspect_ratio=$("#aspect").value; }
  else { body.size=$("#size").value; }

  $("#go").disabled=true; $("#out").textContent="提交中（取 Turnstile token + 轮询，通常 30-90s）…";
  $("#preview").innerHTML="";
  const t0=Date.now();
  try{
    const r = await fetch(fam==="video"?"/v1/videos":"/v1/images",
        {method:"POST",headers:H,body:JSON.stringify(body)});
    const d = await r.json();
    $("#out").textContent = JSON.stringify(d,null,2);
    if(d.output_url){
      if(fam==="video"){ $("#preview").innerHTML=`<video src="${d.output_url}" controls style="max-width:100%;border-radius:8px;margin-top:12px"></video>`; }
      else { $("#preview").innerHTML=`<img src="${d.output_url}" style="max-width:100%;border-radius:8px;margin-top:12px">`; }
    }
  }catch(e){ $("#out").textContent="请求异常: "+e; }
  finally{
    $("#go").disabled=false;
    $("#out").textContent += "\n\n耗时 "+((Date.now()-t0)/1000).toFixed(1)+"s";
    health();
  }
};

health(); models();
setInterval(health, 30000);
</script>
</body>
</html>
